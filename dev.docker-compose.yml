services:
  backend:
    image: gradle:9.3.1-jdk25-alpine
    command: sh -c "cd /booklore-api && ./gradlew bootRun"
    ports:
      - "${BACKEND_PORT:-6060}:6060"
      - "127.0.0.1:${REMOTE_DEBUG_PORT:-5005}:5005"
    environment:
      - DATABASE_URL=jdbc:postgresql://backend_db:5432/booklore
      - DATABASE_USERNAME=booklore
      - DATABASE_PASSWORD=booklore
      - REMOTE_DEBUG_ENABLED=true
      - ALLOWED_ORIGINS=http://localhost:4200
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      - backend_db
    volumes:
      - './booklore-api:/booklore-api'
      - /booklore-api/build
      - /booklore-api/.gradle
      - ./shared/data:/app/data
      - ./shared/books:/books
      - ./shared/bookdrop:/bookdrop

  backend_db:
    image: postgres:17
    container_name: backend_db
    volumes:
      - backend_db:/var/lib/postgresql/data
    restart: unless-stopped
    environment:
      - POSTGRES_DB=booklore
      - POSTGRES_USER=booklore
      - POSTGRES_PASSWORD=booklore
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U booklore -d booklore" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    image: node:22-alpine
    command: sh -c "cd /angular-app && npm install -g @angular/cli && npm ci && ng serve --host 0.0.0.0"
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true
    restart: unless-stopped
    volumes:
      - './booklore-ui:/angular-app'

        # you can have node_modules in a volume. however, if you enable this, expect trouble in some IDEs, as the deps are not available anymore
        # - node_modules:/angular-app/node_modules
    ports:
      - "${FRONTEND_PORT:-4200}:4200"

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: pgweb
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgres://booklore:booklore@backend_db:5432/booklore?sslmode=disable
    depends_on:
      - backend_db

volumes:
  node_modules:
  backend_db:
