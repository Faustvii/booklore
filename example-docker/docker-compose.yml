services:
  booklore:
    # Official Docker Hub image:
    image: booklore/booklore:latest
    # Or the GHCR image:
    # image: ghcr.io/booklore-app/booklore:latest
    container_name: booklore
    user: "${APP_USER_ID:-1000}:${APP_GROUP_ID:-1000}"  # Optional: run as a specific host uid:gid
    environment:
      - TZ=Etc/UTC
      - DATABASE_URL=jdbc:postgresql://postgres:5432/booklore   # Only modify this if you're familiar with JDBC and your database setup
      - DATABASE_USERNAME=booklore                             # Must match POSTGRES_USER defined in the postgres container
      - DATABASE_PASSWORD=your_secure_password                 # Use a strong password; must match POSTGRES_PASSWORD defined in the postgres container
      - SWAGGER_ENABLED=false                               # Enable or disable Swagger UI (API docs). Set to 'true' to allow access; 'false' to block access (recommended for production).
      - FORCE_DISABLE_OIDC=false                            # Set to 'true' to force-disable OIDC and allow internal login, regardless of UI config
      # ALLOWED_ORIGINS=                                    # Comma-separated list of allowed cross-origin URLs for CORS (e.g. https://app.example.com). Defaults to '*' (allow all) if unset. Leave empty to restrict to same-origin.
      # JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -Xmx256m -XX:+UseCompactObjectHeaders -XX:+ExitOnOutOfMemoryError  # For very constrained hardware (RPi 3, 512MB RAM). Uncomment and adjust as needed.
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6060:6060" # HostPort:ContainerPort — container port is 6060 by default (configurable via BOOKLORE_PORT env var)
    volumes:
      - ./data:/app/data       # Application data (settings, metadata, cache, etc.). Persist this folder to retain your library state across container restarts.
      - ./books:/books         # Primary book library folder. Mount your collection here so BookLore can access and organize your books.
    healthcheck:
      test: wget -q -O - http://localhost:6060/api/v1/healthcheck
      interval: 60s
      retries: 5
      start_period: 60s
      timeout: 10s
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      - TZ=Etc/UTC
      - POSTGRES_DB=booklore
      - POSTGRES_USER=booklore                     # Must match DATABASE_USERNAME defined in the booklore container
      - POSTGRES_PASSWORD=your_secure_password     # Use a strong password; must match DATABASE_PASSWORD defined in the booklore container
    volumes:
      - ./config:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U booklore -d booklore" ]
      interval: 5s
      timeout: 5s
      retries: 10